# DRAFT shifter instructions for the older CRV DQM histograms (crvreco-005-001, CrvDQMcollector),
# for the add-on comparison with TranAD. NOT written or reviewed by the CRV group.
# Written on 2026-11-15 from the summed reference runs of each configuration period
# (120066, 120788, 121113, 121693, 122316, 122834, 124228, 125026, 125159). The reference
# shown with each plot is the golden run of the input run's own configuration period.
# Every number is an observation of those runs, not a detector specification.
version: '0.1-draft'
subsystem: CRV
plots:
  crvPEsMPV_CRVsector0: &mpv
    title: CRV PE MPV per channel, sector 0
    folder: CrvDQMcollector
    xlabel: PE most probable value per channel
    instruction: |
      Description: The distribution, over the channels of the sector, of each channel's PE
      most probable value (MPV) from its pulse-height fit, summed over the run's subruns.
      Each channel adds one entry per subrun. The bin at 0 counts channels with no MPV
      (not read out, dead, or too few pulses for a fit).
      Quality criteria for cosmics: compare with the reference, which is a good run of the
      same detector configuration. The populated channels form one peak, near 40-50 PE
      depending on the period, a few PE to about 10 PE wide. The input's peak must be at
      the same position as the reference's within about 3 PE, with a similar width. The
      fraction of entries in the 0 bin (channels with no MPV) must be similar to the
      reference's, within about 5 percentage points. Must be reported: a shifted or split
      peak (gain change on some channels), a much broader peak, a clearly larger fraction
      in the 0 bin (channels lost), or a peak where the reference has almost none (or the
      reverse), which means a different set of channels is read out.
      Known issues: Some sectors have most of their channels in the 0 bin in some periods;
      that is normal if the reference shows the same. The number of entries depends on the
      number of subruns and is not a quality criterion.
      Action for the CRV shifter: if the quality criteria are not met, mark the run BAD,
      make an elog entry with the plot, and contact the CRV expert on call.
  crvPEsMPV_CRVsector1:
    <<: *mpv
    title: CRV PE MPV per channel, sector 1
  crvDigisPerChannelAndEvent_CRVsector0: &dpe
    title: CRV digis per channel and event, sector 0
    folder: CrvDQMcollector
    xlabel: Digis per channel per event
    instruction: |
      Description: The distribution, over the channels of the sector, of each channel's
      mean number of digis per event (its occupancy), summed over the run's subruns. Each
      channel adds one entry per subrun. The bin at 0 counts channels with no digis.
      Quality criteria for cosmics: compare with the reference, a good run of the same
      detector configuration. The populated channels form a peak (near 0.01-0.05 digis per
      channel per event, depending on the period) with a tail to higher occupancy. The
      peak must be at the same position as the reference's within about 20%, with a
      similar shape. The fraction in the 0 bin must be similar to the reference's, within
      about 5 percentage points. Must be reported: a shifted peak (a change of rate or
      threshold), a second peak or a long tail at high occupancy that the reference does
      not have (noisy or hot channels), or a clearly larger fraction in the 0 bin (channels
      lost).
      Known issues: Sector 1 has many channels in the 0 bin in some periods; that is normal
      if the reference shows the same. The number of entries is not a quality criterion.
      Action for the CRV shifter: if the quality criteria are not met, mark the run BAD,
      make an elog entry with the plot, and contact the CRV expert on call.
  crvDigisPerChannelAndEvent_CRVsector1:
    <<: *dpe
    title: CRV digis per channel and event, sector 1
  crvPedestals_CRVsector0:
    title: CRV pedestal per channel, sector 0
    folder: CrvDQMcollector
    xlabel: Pedestal (ADC)
    instruction: |
      Description: The distribution, over the channels of sector 0, of each channel's
      pedestal (baseline) in ADC counts, summed over the run's subruns.
      Quality criteria for cosmics: a single peak near 2046 ADC, about 9 ADC wide (standard
      deviation), between about 2010 and 2080 ADC, as in the reference. Must be reported: a
      shift of the peak by more than about 3 ADC, a clearly broader or split peak, or
      entries outside 2000-2100 ADC.
      Known issues: Pedestals come from calibration and change rarely; a change usually
      means a new calibration was loaded. The number of entries is not a quality criterion.
      Action for the CRV shifter: if the quality criteria are not met, mark the run BAD,
      make an elog entry with the plot, and contact the CRV expert on call.
  crvDigiRates_ROC1: &rate
    title: CRV digi rate per channel, ROC 1
    folder: CrvDQMcollector
    xlabel: Channel in ROC 1
    combine: mean
    instruction: |
      Description: The digi rate of each channel read out by this ROC (1536 channels for
      ROC 1), averaged over the run's subruns. This is a map: the y value is a rate, not a
      count, so the Entries number in the stats box has no meaning.
      Quality criteria for cosmics: compare with the reference, a good run of the same
      detector configuration. The same channel ranges must be populated, with the same
      pattern of levels between ranges (some ranges sit at about half the rate of others).
      The overall rate may differ from the reference by up to about 30%. Must be reported:
      a range of 32 or more adjacent channels that is populated in the reference but at
      zero or near zero in the input (an FEB or link lost); a range far above its level in
      the reference (noise or a threshold problem); single channels more than about 5 times
      their neighbours (hot channels) that the reference does not have.
      Known issues: A few isolated channels at zero, or single spikes that the reference
      also has, are tolerated.
      Action for the CRV shifter: if the quality criteria are not met, mark the run BAD,
      make an elog entry with the plot, and contact the CRV expert on call.
  crvDigiRates_ROC2:
    <<: *rate
    title: CRV digi rate per channel, ROC 2
    xlabel: Channel in ROC 2
